[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-core"
version = "0.1.0"
description = "A small, provider-independent foundation for a personal AI assistant."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic-settings>=2.2,<3.0",
    "uvicorn>=0.27,<1.0",
    # v7.4 travel: IANA time zones for itineraries. Unconditional, not just Windows: Windows has no system time
    # zone database, and slim Linux containers often lack one; zoneinfo still prefers the system copy when present.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]
persistence = ["psycopg[binary]>=3.1,<4.0"]
# PDF text extraction for research documents (v6.2). Pure Python.
documents = ["pypdf>=6.21,<7.0"]  # 6.21+ has the configurable decompression and parsing limits
# Optional real-browser provider (v2.6). Exact pin: each release expects one Chromium build.
browser = ["playwright==1.64.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
"jarvis.orchestration" = ["config/*.json"]
"jarvis.routing" = ["config/*.json", "datasets/*.json"]
"jarvis.reasoning" = ["datasets/*.json"]
